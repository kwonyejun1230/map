name: BuildMap CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout 코드
      uses: actions/checkout@v3

    - name: ☕ Java 17 세팅
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: 🧱 Maven 빌드
      run: mvn -B package --file pom.xml

    - name: 📦 빌드 결과 업로드
      uses: actions/upload-artifact@v4
      with:
        name: BuildMap-JAR
        path: target/*.jar
